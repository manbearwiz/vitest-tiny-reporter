name: Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures

      - name: Lint code
        run: npm run lint

      - name: Test
        run: npm run coverage

      - name: Build
        run: npm run build

  e2e:
    name: e2e (Vitest ${{ matrix.vitest }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the vitest peerDependencies range.
        vitest: [3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Vitest ${{ matrix.vitest }}
        working-directory: e2e
        run: npm install --no-save --no-package-lock --no-audit --no-fund vitest@${{ matrix.vitest }}

      - name: Run reporter against Vitest ${{ matrix.vitest }}
        working-directory: e2e
        run: |
          reporter="$PWD/../dist/vitest-tiny-reporter.js"
          diff -u expected-mixed.txt <(npx vitest run --no-color --reporter="$reporter")
          diff -u expected-passing.txt <(npx vitest run --no-color --reporter="$reporter" passing)
